# Weekly pull requests for newer dependency versions. Security fixes come sooner,
# once "Dependabot security updates" is on in the repository settings.
version: 2
updates:
  - package-ecosystem: pip            # requirements.txt and requirements-dev.txt (uv pip compile)
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }     # one pull request for all of them
  - package-ecosystem: docker         # the Dockerfile's pinned base image
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
