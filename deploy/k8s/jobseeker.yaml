# jobseeker on minikube: one pod (SQLite and the background refresh lock allow only one),
# its data on a volume. Outbound traffic (career sites, KEV) goes through the sandbox
# proxy via the relay that deploy/minikube-network.sh runs on 192.168.49.1:3128; the same
# script relays sandbox port 8090 to the Service's node port 30090, for the browser.
apiVersion: v1
kind: Namespace
metadata:
  name: jobseeker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jobseeker-data
  namespace: jobseeker
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobseeker
  namespace: jobseeker
spec:
  replicas: 1
  strategy:
    type: Recreate          # never two pods on the same SQLite file
  selector:
    matchLabels:
      app: jobseeker
  template:
    metadata:
      labels:
        app: jobseeker
    spec:
      securityContext:
        fsGroup: 1000       # the image's jobseeker user can write the volume
      containers:
        - name: jobseeker
          image: jobseeker:dev
          imagePullPolicy: Never   # loaded with `minikube image load`, no registry
          ports:
            - containerPort: 8090
          env:
            - name: HTTPS_PROXY
              value: http://192.168.49.1:3128
            - name: HTTP_PROXY          # KEV is plain http (host.docker.internal:8009)
              value: http://192.168.49.1:3128
            - name: NO_PROXY
              value: localhost,127.0.0.1,::1,.svc,.cluster.local,10.96.0.0/12,10.244.0.0/16
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8090
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jobseeker-data
---
apiVersion: v1
kind: Service
metadata:
  name: jobseeker
  namespace: jobseeker
spec:
  type: NodePort          # a fixed port on the node: stays reachable across pod restarts
  selector:
    app: jobseeker
  ports:
    - port: 8090
      targetPort: 8090
      nodePort: 30090
